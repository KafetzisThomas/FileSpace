<h1>Your Drive</h1>

<div class="d-flex gap-3">
  <form action="{% url 'files:new_file' %}" method="get" style="display:inline;">
    <button type="submit" class="btn btn-primary">Upload new file</button>
  </form>
  <form method="post" action="{% url 'users:logout' %}" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Logout</button>
  </form>
</div>

<hr>

{% if files %}
    {% for file in files %}
      <li>
        <strong>{{ file.name }}</strong>
        <br>
        <a href="{{ file.file.url }}" download>Download</a>
        <br>
        <small>Uploaded: {{ file.uploaded_at }}</small>
      </li>
      <hr>
    {% endfor %}
{% else %}
  <p>Your drive is empty.</p>
{% endif %}
