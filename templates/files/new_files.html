{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Upload Files{% endblock title %}

{% block content %}
    <h1>Upload Files</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="file_field" multiple required>
        <button type="submit">Upload</button>
    </form>
{% endblock content %}
