{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Account{% endblock title %}

{% block content %}
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} text-center">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <div class="container d-flex justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <h1 class="text-center mt-4 mb-4">Your Account Settings</h1>

            <form action="{% url 'users:account' %}" method="post" class="mb-4 border-bottom pb-4">
                {% csrf_token %}
                <input type="hidden" name="action" value="update_username">
                {{ username_form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-2">Update Username</button>
            </form>

        </div>
    </div>
{% endblock content %}
