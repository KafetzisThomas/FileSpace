{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Register{% endblock title %}

{% block content %}
    <div class="container d-flex justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <h1 class="text-center mt-4 mb-4">Register</h1>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="mt-2">
                    <div class="progress" style="height: 8px;">
                        <div id="password-strength-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                    <small id="password-strength-text" class="form-text"></small>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-2">Register</button>
            </form>
            <hr>
            <a href="{% url 'users:login' %}" class="btn btn-outline-secondary w-100">Login</a>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pwd = document.getElementById('id_password1');
            const bar = document.getElementById('password-strength-bar');
            const text = document.getElementById('password-strength-text');

            const levels = ["Very Weak", "Weak", "Fair", "Good", "Strong"];
            const colors = ["bg-danger", "bg-danger", "bg-warning", "bg-primary", "bg-success"];

            pwd.addEventListener('input', () => {
                const val = pwd.value;
                const result = zxcvbn(val);

                const score = result.score;  // 0 – 4 (=5 levels -> above list)
                const percentage = (score + 1) * 20;

                bar.style.width = percentage + "%";
                bar.className = "progress-bar " + colors[score];
                bar.setAttribute("aria-valuenow", percentage);
                text.textContent = levels[score] + (val ? ` — ${result.feedback.suggestions.join(' ')}` : "");
            });
        });
    </script>
{% endblock content %}
