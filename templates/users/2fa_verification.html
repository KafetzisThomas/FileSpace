{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}2FA Verification{% endblock title %}

{% block content %}
    <div class="container d-flex justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <h1 class="text-center mt-4 mb-4">2FA Verification</h1>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form action="{% url 'users:2fa_verification' %}" method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button name="submit" class="btn btn-primary w-100">Verify</button>
            </form>
        </div>
    </div>
{% endblock content %}
